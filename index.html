<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>毛球寵物店 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<style>
:root{--pink:#ff8fab;--pink2:#ffc2d1;--cream:#fff8ef;--ink:#4a3b3f;--mint:#7fd8be;--sky:#8ecbff;--gold:#ffc94a;--red:#ff6b6b;--card:#ffffff;--shadow:0 4px 14px rgba(80,40,50,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8ff;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.hidden{display:none!important}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:8px 8px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:10}
.hrow{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.chip{pointer-events:auto;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 9px;box-shadow:var(--shadow);font-weight:700;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:4px}
#money{color:#c98a00;font-size:15px}
#spd{display:flex;gap:2px;padding:3px}
#spd button{background:transparent;border-radius:10px;padding:3px 7px;font-size:12px;font-weight:800}
#spd button.on{background:var(--pink);color:#fff}
.grow{flex:1}
#goalsMini{pointer-events:auto;background:rgba(255,255,255,.9);border-radius:14px;padding:6px 10px;box-shadow:var(--shadow);font-size:12px;max-width:100%;line-height:1.5}
#goalsMini .g{display:flex;gap:6px;align-items:center}
#goalsMini .g.done{color:#2a9d6f}
#goalsMini .t{font-weight:800;font-size:12px;color:var(--pink)}
#envChip{cursor:pointer}
/* toolbar */
#bar{position:fixed;left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;gap:5px;justify-content:center;z-index:10;pointer-events:none}
#bar button{pointer-events:auto;flex:1;max-width:86px;min-width:0;background:rgba(255,255,255,.95);border-radius:16px;box-shadow:var(--shadow);padding:6px 2px 5px;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px}
#bar button span{font-size:22px;line-height:1.1}
#bar button:active{transform:scale(.94)}
/* bubbles */
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.bub{position:absolute;left:0;top:0;will-change:transform;transform:translate(-50%,-100%);background:#fff;border-radius:12px;padding:1px 5px;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap;transition:opacity .2s}
.bub:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.cust{font-size:14px;font-weight:700}
.bub.staffTag{font-size:12px;background:#ff8fab;color:#fff;padding:2px 7px}
.bub.staffTag:after{border-top-color:#ff8fab}
input{user-select:text;-webkit-user-select:text;touch-action:manipulation}
.bub.sel{outline:3px solid var(--pink)}
.coin{position:absolute;transform:translate(-50%,-100%);font-weight:900;font-size:18px;color:#e0a100;text-shadow:0 1px 0 #fff,0 0 6px #fff;animation:up 1.4s ease-out forwards;pointer-events:none}
.coin.neg{color:#e05555}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:72%;background:var(--cream);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.2);z-index:20;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease}
#sheet.open{transform:none}
#sheetHead{flex:none;display:flex;align-items:center;padding:12px 14px 6px;gap:8px}
#sheetTitle{font-weight:900;font-size:18px;flex:1}
#sheetClose{background:#ffe1e8;border-radius:50%;width:34px;height:34px;font-size:18px}
#sheetTabs{flex:none;display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto}
#sheetTabs button{background:#fff;border-radius:12px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.1);white-space:nowrap}
#sheetTabs button.on{background:var(--pink);color:#fff}
#sheetBody{flex:1;min-height:0;overflow-y:auto;padding:0 12px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card{background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 5px rgba(0,0,0,.08);display:flex;gap:10px;align-items:center}
.card .ic{font-size:30px;width:40px;text-align:center;flex:none}
.card .info{flex:1;min-width:0}
.card .nm{font-weight:900;font-size:15px}
.card .ds{font-size:12px;color:#8a7479;margin-top:2px}
.card .btns{display:flex;gap:5px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.btn{background:var(--pink);color:#fff;border-radius:12px;padding:7px 11px;font-weight:800;font-size:13px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid #f0d6dc}
.btn.green{background:#3fbf8f}
.btn.blue{background:#5aa9f0}
.btn.gold{background:#f0b400}
.btn:disabled{opacity:.4}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:8px;background:#ffe1e8;color:#d0476c;margin-left:4px}
.tag.hot{background:#ffe08a;color:#a05a00}
.tag.cold{background:#dde8f5;color:#5a7090}
.tag.ok{background:#d6f5e8;color:#2a8f60}
.sec{font-weight:900;margin:10px 2px 6px;color:#b06a80;font-size:13px}
/* pet panel */
.petTop{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.petTop .big{font-size:46px}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:5px 0}
.stat .lb{width:44px}
.bar{flex:1;height:12px;background:#f3e3e6;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.stat .v{width:30px;text-align:right}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.acts button{background:#fff;border-radius:14px;padding:8px 2px;font-size:12px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;gap:2px}
.acts button span{font-size:22px}
.acts button:disabled{opacity:.35}
.note{background:#fff3c4;border-radius:12px;padding:8px 10px;font-size:12px;margin:6px 0;line-height:1.5}
.warn{background:#ffe1e1;color:#a33}
/* sliders */
.slider{margin:10px 2px}
.slider label{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
input[type=range]{width:100%;height:34px;accent-color:var(--pink)}
table.cmp{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:12px;overflow:hidden}
table.cmp td,table.cmp th{padding:6px;border-bottom:1px solid #f3e3e6;text-align:center}
/* modal */
#modal{position:fixed;inset:0;background:rgba(60,30,40,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#modalBox{background:var(--cream);border-radius:22px;padding:18px;width:100%;max-width:420px;max-height:88%;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.3);touch-action:pan-y}
#modalBox h2{margin:0 0 8px;font-size:21px;text-align:center}
.row{display:flex;justify-content:space-between;padding:5px 2px;font-size:14px;border-bottom:1px dashed #ecd5da}
.row b.p{color:#2a9d6f}.row b.n{color:#d04848}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtns .btn{flex:1;padding:12px;font-size:15px}
/* dialogue */
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 10px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(60,30,40,.35) 30%);}
#dlgBox{background:#fff;border-radius:20px;padding:14px 14px 12px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;max-width:640px;margin:0 auto;min-height:110px;position:relative}
#dlgFace{font-size:40px;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
#dlgName{font-weight:900;font-size:14px;margin-bottom:4px}
#dlgText{font-size:15px;line-height:1.6}
#dlgNext{position:absolute;right:14px;bottom:8px;font-size:12px;color:#c08090;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
#dlgSkip{position:absolute;right:10px;top:-34px;background:rgba(255,255,255,.9);border-radius:12px;padding:5px 12px;font-size:12px;font-weight:800}
/* title */
#title{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#ffd6e2 0%,#fff2d6 50%,#d6f0ff 100%);overflow-y:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom));touch-action:pan-y}
#title h1{text-align:center;font-size:34px;margin:10px 0 0;color:#e2557c;text-shadow:0 3px 0 #fff}
#title .sub{text-align:center;color:#a07080;font-weight:700;margin-bottom:12px}
#title .paws{text-align:center;font-size:40px;letter-spacing:6px;margin:6px 0}
.lv{background:#fff;border-radius:16px;padding:11px 14px;margin:8px auto;max-width:460px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);width:100%;text-align:left}
.lv .no{width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.lv.locked{opacity:.45}
.lv .lt{font-weight:900;font-size:15px}
.lv .ld{font-size:12px;color:#a08088}
.lv .st{margin-left:auto;font-size:18px}
.bigbtn{display:block;margin:10px auto;max-width:460px;width:100%;padding:14px;border-radius:18px;font-size:17px;font-weight:900;background:var(--pink);color:#fff;box-shadow:var(--shadow)}
.bigbtn.alt{background:#fff;color:var(--ink)}
#toast{position:fixed;left:50%;top:168px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.toast{background:rgba(74,59,63,.9);color:#fff;padding:8px 14px;border-radius:14px;font-size:13px;font-weight:700;animation:tin .25s ease;max-width:100%;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#menuBtn,#saveBtn{font-size:16px;padding:5px 9px}
#viewBtn{position:fixed;right:10px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:10;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:var(--shadow);font-size:20px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#e2557c;background:#fff2f5;z-index:100}
</style>
</head>
<body>
<div id="loading">🐾 載入中…</div>
<canvas id="c"></canvas>
<div id="bubbles"></div>
<div id="hud" class="hidden">
  <div class="hrow">
    <div class="chip" id="money">💰 0</div>
    <div class="chip" id="clock">📅 1 ⏰ 09:00</div>
    <div class="grow"></div>
    <button class="chip" id="saveBtn">💾</button>
    <button class="chip" id="menuBtn">☰</button>
  </div>
  <div class="hrow">
    <div class="chip" id="envChip">🌡️ 24° 💧55%</div>
    <div class="chip" id="weatherChip">🌸 外 22°</div>
    <div class="grow"></div>
    <div class="chip" id="spd"><button data-s="0">⏸</button><button data-s="1" class="on">▶</button><button data-s="2">×2</button><button data-s="4">×4</button></div>
  </div>
  <div id="goalsMini"></div>
</div>
<button id="viewBtn" class="hidden" title="回到全景">🔭</button>
<div id="bar" class="hidden">
  <button data-p="shop"><span>🛒</span>進貨</button>
  <button data-p="inv"><span>📦</span>倉庫</button>
  <button data-p="deco"><span>🖼️</span>擺飾</button>
  <button data-p="upg"><span>🔧</span>升級</button>
  <button data-p="env"><span>🌡️</span>環境</button>
  <button data-p="staff"><span>👥</span>店員</button>
  <button data-p="note"><span>📒</span>筆記</button>
</div>
<div id="toast"></div>
<div id="sheet"><div id="sheetHead"><div id="sheetTitle"></div><button id="sheetClose">✕</button></div><div id="sheetTabs"></div><div id="sheetBody"></div></div>
<div id="modal" class="hidden"><div id="modalBox"></div></div>
<div id="dlg" class="hidden"><div id="dlgBox"><button id="dlgSkip">略過 ⏭</button><div id="dlgFace"></div><div><div id="dlgName"></div><div id="dlgText"></div></div><div id="dlgNext">點一下繼續 ▼</div></div></div>
<div id="title" class="hidden"></div>

function tex(w, h, draw, repeat) {

}
function mergeStatic(root, exclude) {
  const groups = []; root.traverse(o => { if (o.children && o.children.length > 1) groups.push(o); });
  groups.forEach(gp => {
    const byMat = new Map();
    gp.children.forEach(c => { if (c.isMesh && !Array.isArray(c.material) && !c.children.length && !(exclude && exclude.has(c)) && c.material.visible !== false && c.geometry.index) { const k = c.material.uuid; if (!byMat.has(k)) byMat.set(k, []); byMat.get(k).push(c); } });
    byMat.forEach(list => {
      if (list.length < 2) return;
      const geos = list.map(c => { c.updateMatrix(); const g2 = c.geometry.clone(); g2.applyMatrix4(c.matrix); return g2; });
      let merged = null; try { merged = mergeGeometries(geos, false); } catch (e) { merged = null; }
      geos.forEach(g2 => g2.dispose()); if (!merged) return;
      const m = new THREE.Mesh(merged, list[0].material); m.castShadow = list.some(c => c.castShadow); m.receiveShadow = list.some(c => c.receiveShadow);
      list.forEach(c => gp.remove(c)); gp.add(m);
    });
  });
}

function windowTex(base, win, cols = 4, rows = 3, sign) {
  return tex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const cw = w / cols, rh = (sign ? h * 0.75 : h) / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      g.fillStyle = win; g.fillRect(c * cw + cw * .2, r * rh + rh * .2, cw * .6, rh * .55);
      g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(c * cw + cw * .2, r * rh + rh * .2, cw * .6, rh * .12);
    }
    if (sign) { g.fillStyle = sign[0]; g.fillRect(0, h * .76, w, h * .24); g.fillStyle = sign[1]; g.font = 'bold 34px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(sign[2], w / 2, h * .88); }
  });
}

  const g = new THREE.Group();
  const t = windowTex(base, '#9fd0f0', Math.max(2, Math.round(w / 2)), Math.max(2, Math.round(h / 2.2)), sign);
  const b = new THREE.Mesh(BOX, new THREE.MeshStandardMaterial({ map: t, roughness: .8 })); b.scale.set(w, h, d); b.position.y = h / 2; b.castShadow = true; b.receiveShadow = true;
  g.add(b); g.add(box(w + .3, .3, d + .3, M(shade(base, .8)), 0, h, 0));
  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g); return g;
}

const _skyDay = new THREE.Color('#bfe3ff'), _skyEve = new THREE.Color('#ffc9a3'), _skyNight = new THREE.Color('#3a3f6b');
function setTimeOfDay(hour, weatherDim = 1) {

  sun.position.set(Math.cos(ang) * 9, 24 + Math.sin(ang) * 6, 10);
  let sky = _skyDay.clone();
  if (f > .62) sky.lerp(_skyEve, Math.min(1, (f - .62) / .25));
  if (f > .88) sky.lerp(_skyNight, Math.min(1, (f - .88) / .12));
  sky.multiplyScalar(weatherDim);

  const dusk = f > .7 ? (f - .7) / .3 : 0;
  sun.intensity = (1.9 - dusk * 1.3) * weatherDim;
  sun.color.set(dusk > .2 ? '#ffd0a0' : '#fff3dc');
  hemi.intensity = (1.15 - dusk * .45) * (0.8 + weatherDim * .2);

let down = null;
const ray = new THREE.Raycaster(), _ndc = new THREE.Vector2();

canvas.addEventListener('pointerup', e => {
  if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y;

  const hits = ray.intersectObjects(objs, true); if (!hits.length) return;

  const poopHit = near.find(h => findUp(h.object, 'poopPen') != null);
  if (poopHit) { const pen = findUp(poopHit.object, 'poopPen'); const p = S.pets.find(q => q.pen === pen && !q.mascot && q.poop > 0); if (p) { cleanPoop(p); popAt(poopHit.point.clone().add(V3(0, .4, 0)), '✨'); if (panel === 'pet') renderPanel(true); return; } }

}
